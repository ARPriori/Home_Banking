<div class="page-shell">
  <header class="page-header">
    <div>
      <p class="eyebrow">Accounts</p>
      <h1>Accounts Overview</h1>
      <p class="muted-copy">Select an account to manage it.</p>
    </div>
  </header>

  <div class="app-panel">
    <div class="debug-banner">
      Loading: {{ loading() }} | Accounts: {{ accounts().length }} items | Route: {{ currentRoute }}
    </div>

    <!-- Show loading state -->
    <div *ngIf="loading()" class="loading">
      <p>Loading accounts...</p>
    </div>

    <!-- Show accounts grid -->
    <div *ngIf="!loading() && accounts().length > 0" class="info-grid">
      <div *ngFor="let a of accounts()" class="info-item" (click)="openAccount(a)" style="cursor:pointer">
        <span>Account</span>
        <strong>{{ a.name }} {{ a.surname }}</strong>
        <p class="muted-copy">ID: {{ a.id }} · {{ a.currency }}</p>
      </div>
    </div>

    <!-- Show error or empty state -->
    <div *ngIf="!loading() && accounts().length === 0" class="empty-state">
      <div *ngIf="error()">{{ error() }}</div>
      <div *ngIf="!error()">No accounts found.</div>
    </div>
  </div>
</div>
